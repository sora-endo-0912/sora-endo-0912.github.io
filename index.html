<body>
<main class="wrap">
  <div class="intro">
    <img class="intro__mark" src="favicon.svg" width="64" height="64" alt="">
    <h1><span class="en">Sora Endo</span> のアプリ</h1>
    <p>作ったアプリの一覧です。</p>
  </div>

  <!--
    アプリを足すとき:
    1. アプリごとにリポジトリを分け、https://sora-endo-0912.github.io/<リポジトリ名>/ で公開する（例: foldtrick）。
    2. 下の <li class="app"> を 1 つ写し、名前・サブタイトル・タグ・3 つのリンク・アイコン（img/<名前>-icon.svg）を替える。
       サポートとプライバシーポリシーのリンクの <span class="vh">Fold Trick の</span> も、そのアプリの名前に替える
       （読み上げのリンクの一覧で、どのアプリのサポートかを聞き分けられるように）。
    3. 新しい順に上へ並べる。
    app-ads.txt はこのリポジトリのルートに 1 つだけ置く（AdMob はここを見に来る）。同じ AdMob のアカウントのアプリなら、
    行は足さなくてよい（運営者 ID の 1 行が全部のアプリに効く）。別の広告網や別のアカウントを使うときだけ行を足す。
  -->
  <ul class="apps">
    <li class="app">
      <div class="app__top">
        <div class="app__icon"><img src="img/foldtrick-icon.svg" width="84" height="84" alt=""></div>
        <div class="app__title">
          <h2 class="app__name"><a class="app__link" href="foldtrick/">Fold Trick</a></h2>
          <p class="app__sub"><span class="nb">閉じて開いて解く、</span><span class="nb">折りたたみ謎解き</span></p>
        </div>
      </div>
      <p class="app__tags"><span class="en">iPhone</span><span>謎解き</span></p>
      <p class="app__more">
        <a href="foldtrick/support.html"><span class="vh">Fold Trick の</span>サポート</a>
        <a href="foldtrick/privacy.html"><span class="vh">Fold Trick の</span>プライバシーポリシー</a>
      </p>
    </li>
  </ul>
</main>

<footer class="foot">
  <div class="wrap"><p class="en">© 2026 Sora Endo</p></div>
</footer>
</body>
</html>
